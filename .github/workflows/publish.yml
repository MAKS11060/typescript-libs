name: Publish

on:
  workflow_dispatch:
    inputs:
      publish-npm:
        type: boolean
        default: true
        required: true
      publish-npm-stage:
        type: boolean
        default: false
        required: false
      publish-jsr:
        type: boolean
        default: true
        required: true
      generate-release:
        type: boolean
        default: true
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish-npm:
    if: inputs.publish-npm
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dprint/check@v2.3

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Publish NPM
        if: ${{ !inputs.publish-npm-stage }}
        run: |
          pnpm --filter @maks11060/openapi publish --access public

      - name: Publish NPM stage
        if: ${{ inputs.publish-npm-stage }}
        run: |
          pnpm --filter @maks11060/openapi stage publish --access public

  publish-jsr:
    if: inputs.publish-jsr
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          cache: true

      - name: Publish to JSR
        run: deno task publish

  # Create Github release with current date
  release:
    if: inputs.generate-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate tag from current Date
        run: |
          CURRENT_DATE=$(date +"%Y.%m.%d")
          BASE_TAG="${CURRENT_DATE}"
          COUNT=1

          git fetch --tags

          while git rev-parse "$BASE_TAG-$COUNT" >/dev/null 2>&1; do
            COUNT=$((COUNT + 1))
          done

          if [ $COUNT -eq 1 ] && ! git rev-parse "$BASE_TAG" >/dev/null 2>&1; then
            FINAL_TAG="$BASE_TAG"
          else
            FINAL_TAG="$BASE_TAG-$COUNT"
          fi

          git tag "$FINAL_TAG"
          git push origin "$FINAL_TAG"

          echo "FINAL_TAG=$FINAL_TAG" >> $GITHUB_ENV
          echo "$FINAL_TAG"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FINAL_TAG }}
          generate_release_notes: true
